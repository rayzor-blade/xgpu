name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to create and publish; leave empty to validate only'
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The wire mailbox test compiles a shared-memory WASI guest and uses
      # the still-unstable wasm atomic wait intrinsic, matching Caribou CI.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-wasip1-threads
      - run: cargo test --workspace --locked

  release-binaries:
    name: Release binary (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
            executable: xgpu-haxe
          - runner: windows-latest
            platform: windows-x86_64
            executable: xgpu-haxe.exe
          - runner: macos-15
            platform: macos-aarch64
            executable: xgpu-haxe
          - runner: macos-15-intel
            platform: macos-x86_64
            executable: xgpu-haxe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release generator
        run: cargo build --release --locked -p xgpu-bindgen --bin xgpu-haxe
      - name: Generate runtime externs
        shell: bash
        run: |
          target/release/${{ matrix.executable }} ash generated/ash
          target/release/${{ matrix.executable }} rayzor generated/rayzor
          target/release/${{ matrix.executable }} javascript generated/javascript
          test -f generated/ash/gpu/GpuDevice.hx
          test -f generated/rayzor/rayzor/gpu/GpuDevice.hx
          test -f generated/javascript/gpu/js/GPUDevice.hx
          git diff --no-index --ignore-space-at-eol --exit-code -- \
            haxe-js/src generated/javascript
      - name: Stage release bundle
        shell: bash
        run: |
          mkdir -p dist/xgpu/bin/${{ matrix.platform }}
          cp target/release/${{ matrix.executable }} dist/xgpu/bin/${{ matrix.platform }}/
          cp -R haxe-js dist/xgpu/
          cp README.md LICENSE LICENSE.hlwgpu dist/xgpu/
          # Ash ships its externs with xgpu.hdll; Rayzor ships them inside
          # xgpu.rpkg. Browser-native Haxe has no runtime adapter, so its
          # complete extern package belongs in this release bundle.
      - uses: actions/upload-artifact@v4
        with:
          name: xgpu-release-${{ matrix.platform }}
          path: dist/xgpu
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [test, release-binaries]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point the nightly tag at this build
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          git tag --force nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly

      - uses: actions/download-artifact@v4
        with:
          pattern: xgpu-release-*
          path: artifacts

      - name: Build release archives
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -qr "../../release/$name.zip" .)
          done
          ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || 'nightly' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || 'xgpu nightly' }}
          files: release/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.release_tag == '' }}
          make_latest: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') && 'true' || 'false' }}
