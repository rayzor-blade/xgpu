[package]
name = "xgpu-bindgen"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Shared WebGPU API, WebIDL, wire, and runtime binding generators"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
# The WebIDL parser the wire generator reads the whole IDL with.
weedle2 = "5"
wgpu-types = "30"
x_idl ={git="https://github.com/rayzor-blade/x-idl.git", rev="61f3f9e775d1f2afe2a0573c30dd101eb88b1aed"}